name: CI

# GitHub reads workflows only from .github/workflows, so this file lives
# here rather than at the repository root. The work itself is in ci/, so
# the same build can be run and inspected locally:
#
#    ci/package.sh
#
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Most of what the suite asserts is arithmetic, cache keys, shell
  # generation and document structure, none of which needs an image
  # processing application. Those run here on every push. The handful that
  # genuinely need PixInsight -- installed modules, the ImageSolver
  # include, opening a window, constructing a dialog -- are skipped rather
  # than faked, and still run locally against the real thing.
  test:
    name: Tests (no PixInsight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # BOTH builds, because Loom now compiles differently on 1.9.4 --
      # AstrometricResiduals does not exist there, and an unresolvable
      # #include makes PJSR discard the whole script silently. Running only
      # the 1.9.5 build would let the 1.9.4 path rot unnoticed until
      # somebody on 1.9.4 found Loom doing nothing at all.
      - name: Run the suite as 1.9.5
        run: node ci/run-tests.js

      - name: Run the suite as 1.9.4
        run: LOOM_TEST_CORE_RELEASE=4 node ci/run-tests.js

  package:
    needs: test
    name: Package the installable zip
    runs-on: ubuntu-latest

    # The workflow token is read-only by default, so publishing a release
    # fails with "Resource not accessible by integration" -- a 403 that
    # reads like a missing secret rather than a missing permission. The
    # packaging job needs to write exactly one thing: releases.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # A tag names the release; anything else takes the version from
      # Util.LOOM_VERSION, which is the single source of truth for it.
      - name: Work out the version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$( sed -n 's/^Util\.LOOM_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                        script/lib/Util.js )"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging Loom $version"

      - name: Build the zip
        run: ci/package.sh "${{ steps.version.outputs.version }}"

      # Proves the archive is installable rather than merely present: one
      # top-level Loom/ folder, the entry point where PixInsight's Feature
      # Scripts dialog will look for it, and the RELEASE marker the
      # updater requires before it will ever replace the directory.
      - name: Check the layout is installable
        run: |
          zip="dist/Loom-${{ steps.version.outputs.version }}.zip"
          unzip -q "$zip" -d /tmp/verify
          test -f /tmp/verify/Loom/script/Loom.js     || { echo "missing script/Loom.js"; exit 1; }
          test -f /tmp/verify/Loom/script/lib/Util.js || { echo "missing script/lib/Util.js"; exit 1; }
          test -f /tmp/verify/Loom/RELEASE            || { echo "missing RELEASE marker"; exit 1; }
          test -f /tmp/verify/Loom/LICENSE            || { echo "missing LICENSE"; exit 1; }
          if [ "$( ls /tmp/verify | wc -l )" -ne 1 ]; then
            echo "the archive must contain exactly one top-level folder:"; ls /tmp/verify; exit 1
          fi
          echo "layout OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Loom-${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      # A tag publishes the archive as a release asset. This is the only
      # place a release is ever built: tagging is the whole procedure, so
      # a maintenance release cannot accidentally ship a zip someone made
      # by hand from a tree that was not the tagged one.
      - name: Build the update repository
        run: ci/repository.sh "${{ steps.version.outputs.version }}"

      # The repository package deploys into the PixInsight INSTALLATION
      # directory, so its top level is src/scripts/Loom -- not Loom, which
      # is what the hand-installed zip carries. Getting this wrong scatters
      # the script across the install tree, and the updater would do it on
      # every subscriber's machine at once.
      - name: Check the repository layout
        run: |
          zip="$( ls dist/repo/*.zip )"
          unzip -q "$zip" -d /tmp/xri
          test -f /tmp/xri/src/scripts/Loom/Loom.js \
            || { echo "missing src/scripts/Loom/Loom.js"; exit 1; }
          test -f /tmp/xri/src/scripts/Loom/FlyThrough.js \
            || { echo "missing src/scripts/Loom/FlyThrough.js"; exit 1; }
          test -f /tmp/xri/src/scripts/Loom/lib/Util.js \
            || { echo "missing src/scripts/Loom/lib/Util.js"; exit 1; }
          test ! -e /tmp/xri/src/scripts/Loom/selftest.js \
            || { echo "selftest.js must not ship: it adds LoomSelfTest to the Script menu"; exit 1; }
          if [ "$( ls /tmp/xri )" != "src" ]; then
            echo "the archive must contain exactly one top-level folder, src:"; ls /tmp/xri; exit 1
          fi
          # The manifest's checksum must be the one the core will compute,
          # or every download fails verification on the user's machine.
          want="$( sed -n 's/.*sha1="\([0-9a-f]*\)".*/\1/p' dist/repo/updates.xri )"
          got="$( sha1sum "$zip" | cut -d' ' -f1 )"
          test "$want" = "$got" \
            || { echo "sha1 mismatch: manifest $want, archive $got"; exit 1; }
          # A namespaced manifest parses, renders its description, and offers
          # ZERO packages -- the failure mode that shipped in 0.1.5. Every
          # working third-party manifest opens with a bare <xri version="1.0">.
          if grep -q 'xmlns' dist/repo/updates.xri; then
            echo "updates.xri must not declare an XML namespace:"
            grep -n 'xmlns' dist/repo/updates.xri
            exit 1
          fi
          grep -q '<platform ' dist/repo/updates.xri \
            || { echo "no <platform> element in the manifest"; exit 1; }
          echo "repository layout OK"

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Install: unzip into your PixInsight scripts folder, so that you
            have `<scripts>/Loom`, then **Script → Feature Scripts → Add**
            and point it at that folder.

            The archive carries a `RELEASE` marker, which is what lets Loom
            recognise the install as its own and update it in place.

  # The update repository, served over HTTPS so PixInsight can subscribe to
  # it: https://fcarucci.github.io/Loom/updates.xri
  #
  # Only on a TAG. Publishing on every push to main would advertise an
  # unreleased build to everyone subscribed, and the updater would install
  # it on their next restart.
  pages:
    needs: package
    name: Publish the update repository
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the repository
        run: ci/repository.sh "${GITHUB_REF_NAME#v}"

      # An index so the URL is not a bare 404 to anyone who opens it in a
      # browser looking for what to subscribe to.
      - name: Write the landing page
        run: |
          cat > dist/repo/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Loom — PixInsight update repository</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif;
                     max-width: 40em; margin: 4em auto; padding: 0 1em;
                     line-height: 1.5; }
              code { background: #f4f4f4; padding: .15em .35em; border-radius: 3px; }
            </style>
          </head>
          <body>
            <h1>Loom</h1>
            <p>A PixInsight update repository. In PixInsight, open
               <b>Resources &rarr; Updates &rarr; Manage Repositories</b>,
               add this URL, then
               <b>Resources &rarr; Updates &rarr; Check for Updates</b>:</p>
            <p><code>https://fcarucci.github.io/Loom/</code></p>
            <p>The repository is not signed, so PixInsight will ask you to
               confirm it once.</p>
            <p><a href="https://github.com/fcarucci/Loom">Source and releases</a>
               &middot; <a href="LICENSE">Licence (MIT)</a></p>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/repo

      - id: deploy
        uses: actions/deploy-pages@v4
